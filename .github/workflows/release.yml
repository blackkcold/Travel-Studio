name: Release
on:
  push:
    branches: [main]
    paths: ['release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/quality.yml
  publish:
    name: Package verified build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: travel-studio-web
          path: dist/
      - name: Verify release identity
        id: identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const release=JSON.parse(fs.readFileSync('release.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(pkg.version)||release.version!==pkg.version||release.status!=='ready')throw new Error('Release manifest does not match the tested package.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${pkg.version}\ntag=v${pkg.version}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-evidence-*
          path: release/verification-evidence/
      - uses: actions/download-artifact@v4
        with:
          name: live-service-evidence
          path: release/verification-evidence/live-services/
      - name: Collect accepted project examples
        run: node scripts/collect-release-examples.mjs
      - name: Package the tested build
        run: node scripts/package-release.mjs
      - name: Record the verified source and run
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const record={version:pkg.version,commit:process.env.GITHUB_SHA,run:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,generatedAt:new Date().toISOString()};
          const text=JSON.stringify(record,null,2)+'\n';
          fs.writeFileSync(`release/Travel-Studio-${pkg.version}/BUILD.json`,text);
          fs.writeFileSync('release/verification-evidence/BUILD.json',text);
          JS
      - name: Smoke-test the production package
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          (cd "release/Travel-Studio-${VERSION}" && exec sh start.sh) > /tmp/travel-studio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ -o /tmp/travel-studio-index.html; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(!fs.readFileSync('/tmp/travel-studio-index.html','utf8').includes('Travel Studio'))throw new Error('Production entry did not load.');
          const status=await (await fetch('http://127.0.0.1:4173/api/ai/status')).json();
          if(status.enabled)throw new Error('The distributable must not ship an AI credential.');
          JS
      - name: Create archives and checksums
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          cd release
          zip -q -r "Travel-Studio-${VERSION}.zip" "Travel-Studio-${VERSION}"
          tar -czf "Travel-Studio-${VERSION}.tar.gz" "Travel-Studio-${VERSION}"
          zip -q -r "Travel-Studio-${VERSION}-verification-evidence.zip" verification-evidence
          sha256sum "Travel-Studio-${VERSION}.zip" "Travel-Studio-${VERSION}.tar.gz" "Travel-Studio-${VERSION}-verification-evidence.zip" > SHA256SUMS.txt
      - name: Publish normal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          current_head=$(gh api "repos/${GH_REPO}/branches/main" --jq .commit.sha)
          test "$current_head" = "$GITHUB_SHA"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Travel Studio ${VERSION}" --notes-file docs/RELEASE_NOTES.md "release/Travel-Studio-${VERSION}.zip" "release/Travel-Studio-${VERSION}.tar.gz" "release/Travel-Studio-${VERSION}-verification-evidence.zip" release/SHA256SUMS.txt
