name: Real map validation
on:
  push:
    branches: [main]
    paths:
      - 'src/map/**'
      - 'src/providers/**'
      - 'tests/map.e2e.spec.ts'
      - 'tests/fixtures/map*'
      - 'playwright.config.ts'
      - '.github/workflows/map-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:providers
      - run: npx playwright test tests/map.e2e.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-map-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
